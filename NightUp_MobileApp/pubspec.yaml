name: nightup_mobile_app
description: "Nightup - Night events platform."
publish_to: 'none'

version: 2.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Animations
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  cached_network_image: ^3.3.0
  flutter_staggered_animations: ^1.1.1
  lottie: ^3.1.0
  animations: ^2.0.11
  
  # Network
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  
  # State Management
  get: ^4.6.5
  
  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  
  # Localization
  flutter_translate: ^3.1.0
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  
  # UI Utilities
  pull_to_refresh: ^2.0.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.0.7
  
  # Validation
  password_strength_checker: ^1.3.2
  
  # Others
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.4
  permission_handler: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/images/
    - assets/animations/
  
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700